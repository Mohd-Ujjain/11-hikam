name: Targeted 3.2.4 creation argument verification - no whole-book suite

# Fork-only evidence workflow. Do not transfer this file upstream.
on:
  push:
    branches: [editorial/3-2-4-ujairi-creation-source-2026-11-28]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: targeted-ujairi-324-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chapter_static:
    name: 3.2.4 build, archive, exact anchors and release isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical build and bounded source checks
        run: |
          test "$GITHUB_REPOSITORY" = "Mohd-Ujjain/11-hikam"
          python -m py_compile src/tests/verify_ujairi_3_2_4_source_led_aids.py src/tests/browser_ujairi_3_2_4_aids.py
          python src/build.py
          python src/build.py --check
          python src/tests/verify_ujairi_3_2_4_source_led_aids.py --isolation
          python src/tests/verify_hikam_3_2_1_through_3_2_6.py
          python src/tests/verify_reading_companions.py
          python src/tests/verify_publication.py
          python src/tests/validate_structure.py

  chapter_browser:
    name: Only 3.2.4 Arabic reading, local disclosures and A4
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser and PDF reader
        run: |
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          python -m playwright install chromium
      - name: Install the established Arabic font families
        # Browser checks block remote font URLs; exercise Amiri/Noto locally.
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y fonts-hosny-amiri fonts-noto-core
          fc-match Amiri
          fc-match 'Noto Sans Arabic'
      - name: Build and exercise 3.2.4 only
        run: |
          python src/build.py
          python src/tests/browser_ujairi_3_2_4_aids.py
      - name: Preserve only chapter screenshots and A4 PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ujairi-324-targeted-${{ github.run_id }}
          path: test-artifacts/ujairi-324-*
          if-no-files-found: ignore
          retention-days: 7

  commit_tested_outputs:
    name: Commit canonical outputs after both bounded jobs pass
    needs: [chapter_static, chapter_browser]
    if: ${{ success() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, verify and commit only generated assets
        env:
          CANDIDATE_BRANCH: editorial/3-2-4-ujairi-creation-source-2026-11-28
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Mohd-Ujjain/11-hikam"
          test "$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          python src/build.py
          python src/build.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Build targeted-verified 3.2.4 reader files [skip ci]"
            git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          fi
          python src/build.py --check
