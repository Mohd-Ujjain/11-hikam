name: Fork QA - Gutting 1.1.4 source and accessible reader
on:
  push:
    branches: [editorial/114-gutting-source-faithful]
permissions:
  contents: write
concurrency:
  group: fork-gutting-114
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild canonical single-file reader and hashed offline assets
        run: |
          python src/build.py
          python src/build.py --check
      - name: Source and structure integrity including Gutting and existing chapters
        run: |
          set -e
          python src/tests/verify_publication.py
          python src/tests/verify_reading_companions.py
          python src/tests/verify_source_attribution.py
          python src/tests/verify_papineau_source_fidelity.py
          python src/tests/verify_gutting_source_fidelity.py
          python src/tests/verify_3_4_house_style.py
          python src/tests/verify_editorial_fidelity.py
          python src/tests/validate_structure.py
          python src/tests/verify_sidebar.py
          python src/tests/verify_reading_progress.py
          python src/tests/verify_reader_search_tabs.py
          python src/tests/verify_revision_visibility.py
          python src/tests/verify_search_integrity.py
          python src/tests/verify_mobile_interaction.py
          python src/tests/verify_visual_polish.py
          node src/tests/test_offline_cache.mjs
          node src/tests/test_optional_precache.mjs
      - name: Install pinned Chromium and PDF inspection tools
        run: |
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          python -m playwright install chromium
      - name: Check full 39-chapter design, typography, colors and contrast
        run: python src/tests/browser_design_tokens.py
      - name: Check 58 cue anchors and native Gutting Source Depth accessibility
        run: python src/tests/browser_reading_companions.py
      - name: Test desktop/mobile reader and actual A4 PDF pages
        run: python src/tests/browser_quality.py
      - name: Test independent house-style and print regressions
        run: python src/tests/browser_3_4_house_style.py
      - name: Test saved position, edition changes and chapter navigation
        run: |
          python src/tests/browser_batch2_continuity.py
          python src/tests/browser_batch4_edition_migration.py
      - name: Test real offline installation, edition upgrade and recovery
        run: python src/tests/browser_pwa_updates.py
      - name: Commit verified generated files only to this secondary-account fork
        run: |
          set -e
          test "$GITHUB_REPOSITORY" = "Mohd-Ujjain/11-hikam"
          test "$GITHUB_REF_NAME" = "editorial/114-gutting-source-faithful"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Build verified Gutting 1.1.4 reader [skip ci]"
            git push origin HEAD:refs/heads/editorial/114-gutting-source-faithful
          fi
          python src/build.py --check
