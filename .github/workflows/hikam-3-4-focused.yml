name: Hikam 3.4 focused verification
on:
  push:
    branches: [audit/hikam-3-4-focused]
permissions:
  contents: read
jobs:
  verify:
    name: Source anchors, layouts and sampled A4 PDFs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify authored edition
        run: |
          python src/build.py --check
          python src/tests/verify_hikam_3_4_2_through_3_4_9.py
          python src/tests/verify_reading_companions.py
          python src/tests/verify_3_4_house_style.py
          python src/tests/verify_editorial_fidelity.py
          python src/tests/verify_publication.py
          python src/tests/validate_structure.py
      - name: Install browser tools
        run: |
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          python -m playwright install --with-deps chromium
      - name: Check only the 3.4 refresh
        run: python src/tests/.hikam-3-4-fork-focused.py
