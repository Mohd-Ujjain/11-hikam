name: Focused Hikam author credit verification
on:
  push:
    branches: [editorial/hikam-44-credit-staging]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Rebuild the scoped credit correction
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = "7482b0fdcbfbc98a804be7baef4aa59c96c4a267"
          printf '%s' '' | base64 -d | gzip -dc >/tmp/credit.patch
          git apply --index /tmp/credit.patch
          python src/build.py
          python src/tests/verify_hikam_3_2_1_through_3_2_6.py
          python src/tests/verify_reading_companions.py
          python src/build.py --check
          git add index.html src/philosophy_study_notes.html service-worker.js
          git rm --cached ".github/workflows/hikam-44-credit-staging.yml"
          test "$(git write-tree)" = "976f53cd558e5c0e04011d1502648d4773808301"
          git restore --staged ".github/workflows/hikam-44-credit-staging.yml"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage verified banner-credit contrast correction'
          git push origin "HEAD:refs/heads/editorial/hikam-44-credit-staging"
