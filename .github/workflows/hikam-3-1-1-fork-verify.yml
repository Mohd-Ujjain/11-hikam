name: Validate Kellenberger 3.1.1 in the isolated fork

# Temporary single-branch fork workflow; remove before transfer to upstream.
on:
  push:
    branches: [editorial/3-1-1-kellenberger-source-led]
    paths-ignore: [index.html, src/philosophy_study_notes.html, service-worker.js]

permissions:
  contents: write

concurrency:
  group: hikam-311-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: Source fidelity, archive, 248 Companions, print and offline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical generation and content-hash validation
        run: |
          set -euo pipefail
          python src/build.py
          python src/build.py --check
      - name: Source, archive, publication, navigation, reader and offline tests
        run: |
          set -euo pipefail
          python src/tests/verify_dossier_archive.py
          python src/tests/verify_philosophy_religion_3_1_1_kellenberger.py
          python src/tests/verify_metaphysics_structure_2_2_5.py
          python src/tests/verify_metaphysics_substance_2_2_6.py
          python src/tests/verify_publication.py
          python src/tests/verify_reading_companions.py
          python src/tests/verify_source_attribution.py
          python src/tests/verify_3_4_house_style.py
          python src/tests/verify_editorial_fidelity.py
          python src/tests/verify_papineau_source_fidelity.py
          python src/tests/verify_gutting_source_fidelity.py
          python src/tests/verify_critchley_source_fidelity.py
          python src/tests/validate_structure.py
          python src/tests/verify_sidebar.py
          python src/tests/verify_reading_progress.py
          python src/tests/verify_reader_search_tabs.py
          python src/tests/verify_revision_visibility.py
          python src/tests/verify_search_integrity.py
          python src/tests/verify_mobile_interaction.py
          python src/tests/verify_visual_polish.py
          node src/tests/test_offline_cache.mjs
          node src/tests/test_optional_precache.mjs
      - name: Install Chromium and pinned PDF inspection packages
        run: |
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          python -m playwright install chromium
      - name: Full-browser accessibility, print, source cues, RTL, contrast, and offline PWA
        run: |
          set -euo pipefail
          python src/tests/browser_quality.py
          python src/tests/browser_design_tokens.py
          python src/tests/browser_reading_companions.py
          python src/tests/browser_3_4_house_style.py
          python src/tests/browser_batch2_continuity.py
          python src/tests/browser_batch4_edition_migration.py
          python src/tests/browser_pwa_updates.py
      - name: Save generated output and PDF/browser validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hikam-kellenberger-311-tested
          path: |
            index.html
            src/philosophy_study_notes.html
            service-worker.js
            test-artifacts/
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit canonically generated assets to tested fork only
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m 'Build verified 3.1.1 Kellenberger source-led edition [skip ci]'
            git push origin HEAD:refs/heads/editorial/3-1-1-kellenberger-source-led
          fi
          python src/build.py --check
