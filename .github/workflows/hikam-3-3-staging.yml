        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Chromium and PDF inspector
        run: |
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          python -m playwright install --only-shell chromium
