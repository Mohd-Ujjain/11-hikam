          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/'src/tests'))
          from browser_design_tokens import site, AUDIT
          from playwright.sync_api import sync_playwright
          from pypdf import PdfReader
          from io import BytesIO
          R=Path.cwd()
          ids=['ch3-3-2','ch3-3-3']
          records=[i for i in json.loads((R/'src/reading_companions.json').read_text())['companions'] if i['chapter'] in ids]
          with site() as url,sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True,args=['--no-sandbox'])
              for width in (390,1366):
                  ctx=browser.new_context(viewport={'width':width,'height':860},reduced_motion='reduce',service_workers='block')
                  ctx.route('https://fonts.googleapis.com/**',lambda r:r.abort())
                  ctx.route('https://fonts.gstatic.com/**',lambda r:r.abort())
                  p=ctx.new_page()
                  errors=[]
                  p.on('pageerror',lambda e:errors.append(str(e)))
                  p.goto(url,wait_until='domcontentloaded')
                  p.wait_for_function("(n) => window.__hikamReadingCompanions && window.__hikamReadingCompanions.attached() === n",arg=len(json.loads((R/'src/reading_companions.json').read_text())['companions']))
                  assert not p.evaluate("window.__hikamReadingCompanions.failed()")
                  audit=p.evaluate(AUDIT)
                  assert not audit['failures'],(width,audit['failures'])
                  popup=p.locator('#hikamCompanionPopup')
                  for item in records:
                      cue=p.locator(f'[data-companion-id="{item["id"]}"]')
                      assert cue.count()==1 and cue.locator('xpath=ancestor::section[1]').get_attribute('id')==item['chapter']
                      depth=p.locator(f'#{item["sourceDepthId"]}')
                      assert depth.count()==1
                      disclosure=depth.locator('xpath=ancestor::details[1]')
                      assert disclosure.get_attribute('open') is None
                      assert disclosure.evaluate("(el,id) => el.previousElementSibling.contains([...document.querySelectorAll('[data-companion-id]')].find(q=>q.dataset.companionId===id))",item['id'])
                      cue.scroll_into_view_if_needed()
                      p.evaluate("() => new Promise(done => requestAnimationFrame(() => requestAnimationFrame(done)))")
                      cue.focus()
                      cue.press('Enter')
                      popup.wait_for(state='visible', timeout=2500)
                      assert popup.get_attribute('dir')=='rtl' and popup.get_attribute('lang')=='ar', (width,item['id'],popup.get_attribute('dir'),popup.get_attribute('lang'))
                      rect=popup.bounding_box()
                      assert rect['x']>=-1 and rect['x']+rect['width']<=width+1,(width,item['id'],rect)
                      p.keyboard.press('Escape')
                      assert popup.is_hidden()
                  for chapter in ids:
                      d=p.locator(f'#{chapter} .hikam-source-depth-inline').first
                      d.locator('summary').click()
                      assert d.get_attribute('open') is not None
                      d.locator('summary').click()
                      assert d.get_attribute('open') is None
                  assert not errors,errors
                  ctx.close()
                  print(f'PASS {width}px: design contract and author contrast; {len(records)} live RTL cues; both native disclosures close and open',flush=True)
              ctx=browser.new_context(viewport={'width':1366,'height':860},service_workers='block')
              ctx.route('https://fonts.googleapis.com/**',lambda r:r.abort())
              ctx.route('https://fonts.gstatic.com/**',lambda r:r.abort())
              p=ctx.new_page();p.goto(url,wait_until='domcontentloaded')
              p.evaluate("(ids) => {window.__printControl.setFilter(ids); window.__printControl.includeRevision(true); window.dispatchEvent(new Event('beforeprint'));}", ids)
              p.emulate_media(media='print')
              print_pages={x:p.locator(f'#{x} > .js-print-page').count() for x in ids}
              assert all(print_pages.values()),print_pages
              assert not p.locator('.js-print-page .hikam-source-depth-inline').count()
              assert not p.locator('.js-print-page .hikam-companion-trigger').count()
              p.evaluate("window.dispatchEvent(new Event('afterprint'))")
              p.emulate_media(media='screen')
              p.evaluate("(id) => {window.__printControl.setFilter([id]); window.dispatchEvent(new Event('beforeprint'));}",ids[-1])
              p.emulate_media(media='print')
              sample=p.locator(f'#{ids[-1]} > .js-print-page').count()
              pdf=PdfReader(BytesIO(p.pdf(print_background=True,prefer_css_page_size=True)))
              assert len(pdf.pages)>=sample>0,(sample,len(pdf.pages))
              for sheet in pdf.pages:
                  assert abs(float(sheet.mediabox.width)-595.28)<2 and abs(float(sheet.mediabox.height)-841.89)<2, sheet.mediabox
              p.evaluate("window.dispatchEvent(new Event('afterprint'))")
              assert not p.locator('.js-print-page').count()
              p.emulate_media(media='screen')
              assert all(p.locator(f'#{x} .hikam-source-depth-inline').count() for x in ids)
              print(f'PASS selected pagination {print_pages}; representative A4 PDF {len(pdf.pages)} pages; optional material excluded and screen original restored',flush=True)
              browser.close()
