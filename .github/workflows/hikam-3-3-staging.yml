name: Focused Hikam 3.3.2 and 3.3.3 verification
on:
  push:
    branches: [editorial/hikam-3-3-2-and-3-3-3-staging]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
