name: Rebuild 39-dossier Hikam reader (temporary)
on:
  push:
    branches: [add-dossiers-3-4-5-through-3-4-9]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare source and publication metadata
        run: python src/tools/prepare_39_edition.py
      - name: Generate HTML and service worker
        run: |
          python src/build.py
          python src/build.py --check
      - name: Verify structure and source fidelity
        run: |
          python src/tests/verify_publication.py
          python src/tests/validate_structure.py
          python src/tests/verify_editorial_fidelity.py
          python src/tests/verify_revision_visibility.py
          python src/tests/verify_search_integrity.py
          python src/tests/verify_visual_polish.py
      - name: Commit rebuilt artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/chapters/subtopic-3-4.html src/main.html src/tests/ index.html src/philosophy_study_notes.html service-worker.js manifest.webmanifest sitemap.xml robots.txt README.md
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild 39-dossier website and update regression checks"
          git push origin HEAD:add-dossiers-3-4-5-through-3-4-9
