name: Verify source-faithful 2.2.5 on isolated Hikam fork

# Temporary fork-only CI. This file is removed before transferring the
# source, tests, archives and generated outputs to the original repository.
on:
  push:
    branches:
      - editorial/2-2-5-source-structure
    paths-ignore:
      - index.html
      - src/philosophy_study_notes.html
      - service-worker.js

permissions:
  contents: write

concurrency:
  group: isolated-hikam-225-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build, sources, archive, browser, print and offline PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble and verify canonical generated edition
        run: |
          python src/build.py
          python src/build.py --check
      - name: Source fidelity, exact anchor and reader invariants
        run: |
          set -euo pipefail
          python src/tests/verify_dossier_archive.py
          python src/tests/verify_metaphysics_structure_2_2_5.py
          python src/tests/verify_publication.py
          python src/tests/verify_reading_companions.py
          python src/tests/verify_source_attribution.py
          python src/tests/verify_3_4_house_style.py
          python src/tests/verify_editorial_fidelity.py
          python src/tests/verify_papineau_source_coverage.py
          python src/tests/verify_gutting_source_coverage.py
          python src/tests/verify_critchley_source_coverage.py
          python src/tests/validate_structure.py
          python src/tests/verify_sidebar.py
          python src/tests/verify_reading_progress.py
          python src/tests/verify_reader_search_tabs.py
          python src/tests/verify_revision_visibility.py
          python src/tests/verify_search_integrity.py
          python src/tests/verify_mobile_interaction.py
          python src/tests/verify_visual_polish.py
          node src/tests/test_offline_cache.mjs
          node src/tests/test_optional_precache.mjs
      - name: Install pinned Chromium and PDF regression dependencies
        run: |
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          python -m playwright install chromium
      - name: Full real-browser reader, RTL, print, colour and PWA suites
        run: |
          set -euo pipefail
          python src/tests/browser_quality.py
          python src/tests/browser_design_tokens.py
          python src/tests/browser_reading_companions.py
          python src/tests/browser_3_4_house_style.py
          python src/tests/browser_batch2_continuity.py
          python src/tests/browser_batch4_edition_migration.py
          python src/tests/browser_pwa_updates.py
      - name: Preserve generated site, PDF samples and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hikam-225-fork-tested
          path: |
            index.html
            src/philosophy_study_notes.html
            service-worker.js
            test-artifacts/
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit canonical outputs from successful testing
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m 'Build source-verified Hikam 2.2.5 outputs [skip ci]'
            git push origin HEAD:refs/heads/editorial/2-2-5-source-structure
          fi
          python src/build.py --check
