          python - <<'ARCHIVE_PY'
          from pathlib import Path
          import re, subprocess
          v=subprocess.check_output(['git','show','HEAD^:src/chapters/subtopic-3-2.html']).decode()
          s=Path('src/archive/pre-prepared-source-2026-11-26')
          for i in range(3,8):
              section=re.search(r'(?ms)^<section class="chapter rtl" id="ch3-2-'+str(i)+r'"[^\n]*>.*?^</section>\n',v)[0]
              (s/f'dossier-3.2.{i}.html').write_text(section)
          ARCHIVE_PY
          git add "src/archive/pre-prepared-source-2026-11-26"
          cat >/tmp/phase2_scope.py <<'SCOPE_PY'
          from pathlib import Path
          import hashlib, json, re, subprocess
          R=Path.cwd()
          S=R/'src'
          base='7f8c0d19148642acd929502400143b392b0154fb'
          targets={f'ch3-2-{n}' for n in range(3,8)}
          module='src/chapters/subtopic-3-2.html'
          manifest='src/reading_companions.json'
          compiled = ['index.html', 'src/philosophy_study_notes.html']
          def old(path):
              return subprocess.check_output(['git','-C',str(R),'show',f'{base}:{path}'])
          def parts(s):
              pattern=r'(?ms)^<section class="chapter(?: rtl)?" id="([^"]+)"[^\n]*>.*?^</section>'
              return [(m[1],m[0]) for m in re.finditer(pattern,s)]
          def masked(s):
              for key, block in parts(s):
                  if key in targets: s=s.replace(block, f'<unchanged-scope {key}>',1)
              return s
          new=(R/module).read_bytes().decode()
          prev=old(module).decode()
          assert masked(new)==masked(prev), 'Source changed beyond the five dossiers'
          latest=dict(parts(new))
          baseline=dict(parts(prev))
          assert set(latest)==set(baseline)
          for key in sorted(targets):
              a,b=baseline[key],latest[key]
              assert a!=b,(key,'no change')
              def pref(t):
                  front=t.split('<div class="chapter-body">',1)[0]
                  # Allow a scope/locator correction after the locked author credit, and
                  # rephrasing the roadmap without replacing any of its components.
                  front=re.sub(r'(<div class="chapter-source"[^>]*><strong>[^<]+</strong>)[^<]*(</div>)',r'\1\2',front,count=1)
                  front=re.sub(r'<li>[^<]*</li>', '<li></li>', front)
                  return front
              assert pref(a)==pref(b),(key,'front matter')
              nav=lambda t:t.split('<nav class="chapter-endnav"',1)[1].split('</nav>',1)[0]
              assert nav(a)==nav(b),(key,'nav')
              n=key[-1]
              snap=S/'archive'/f'pre-prepared-source-2026-11-26/dossier-3.2.{n}.html'
              assert snap.read_bytes() == (a+'\n').encode(),(key,'archive')
              print(f'PASS {key} same metadata and navigation; exact public predecessor snapshot')
          p,q=json.loads(old(manifest)),json.loads((R/manifest).read_text())
          def outside(m): return [i for i in m['companions'] if i['chapter'] not in targets]
          assert outside(p)==outside(q),'out-of-scope companion changed'
          assert len(p['companions'])==len(q['companions'])==318
          for n in range(3,8):
              c=lambda m: [i['id'] for i in m['companions'] if i['chapter']==f'ch3-2-{n}']
              assert c(p)==c(q),(n,'companion ID change')
          def mask_render(s):
              marker=r'(<script type="application/json" id="hikamReadingCompanionsData">)(.*?)(</script>)'
              def keep(m):
                  payload=json.loads(m[2])
                  payload['companions']=outside(payload)
                  return m[1]+json.dumps(payload,ensure_ascii=False,separators=(',',':'))+m[3]
              return re.sub(marker,keep,masked(s),count=1,flags=re.S)
          for path in compiled:
              assert mask_render((R/path).read_bytes().decode())==mask_render(old(path).decode()),path
          print('PASS chapter-only authored and generated diff; all companion IDs and out-of-scope entries unchanged')
          SCOPE_PY
          python src/build.py
          for t in verify_hikam_3_2_1_through_3_2_6 verify_hikam_3_2_7_and_3_2_8 verify_dossier_archive verify_reading_companions validate_structure verify_publication verify_source_attribution verify_search_integrity verify_revision_visibility verify_sidebar; do
            python "src/tests/$t.py"
          done
