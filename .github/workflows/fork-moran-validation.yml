name: Fork CI — Moran contextual pilot
on:
  push:
    branches:
      - editorial/contextual-companions-source-depth-moran

permissions:
  contents: write

concurrency:
  group: fork-moran-contextual-pilot
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Canonical build, source, print and offline browser verification
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical build and edition consistency
        run: |
          python src/build.py
          python src/build.py --check
      - name: Source, structure, publication and reading-system checks
        run: |
          set -e
          python src/tests/verify_publication.py
          python src/tests/verify_reading_companions.py
          python src/tests/verify_source_attribution.py
          python src/tests/verify_3_4_house_style.py
          python src/tests/verify_editorial_fidelity.py
          python src/tests/validate_structure.py
          python src/tests/verify_sidebar.py
          python src/tests/verify_reading_progress.py
          python src/tests/verify_reader_search_tabs.py
          python src/tests/verify_revision_visibility.py
          python src/tests/verify_search_integrity.py
          python src/tests/verify_mobile_interaction.py
          python src/tests/verify_visual_polish.py
          node src/tests/test_offline_cache.mjs
          node src/tests/test_optional_precache.mjs
      - name: Install pinned browser and PDF tools
        run: |
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          python -m playwright install chromium
      - name: Full Chromium, RTL, pagination and PWA regression suite
        run: |
          set -e
          python src/tests/browser_quality.py
          python src/tests/browser_reading_companions.py
          python src/tests/browser_3_4_house_style.py
          python src/tests/browser_batch2_continuity.py
          python src/tests/browser_batch4_edition_migration.py
          python src/tests/browser_pwa_updates.py
      - name: Save failing visual evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fork-moran-failure-evidence
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit verified generated assets ONLY to fork editorial branch
        run: |
          set -e
          test "$GITHUB_REPOSITORY" = "Mohd-Ujjain/11-hikam"
          test "$GITHUB_REF_NAME" = "editorial/contextual-companions-source-depth-moran"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Build tested contextual Moran publication assets in CI fork"
            git push origin HEAD:editorial/contextual-companions-source-depth-moran
          fi
      - name: Verify exact final edition after generated commit
        run: python src/build.py --check
