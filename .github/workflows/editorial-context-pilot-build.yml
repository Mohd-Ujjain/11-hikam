name: Temporary contextual Moran pilot build
on:
  push:
    branches: [editorial/contextual-companions-source-depth-moran]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/contextual-companions-source-depth-moran
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble canonical publication
        run: python src/build.py
      - name: Check source anchors, context details, publication and structure
        run: |
          python src/build.py --check
          python src/tests/verify_reading_companions.py
          python src/tests/verify_publication.py
          python src/tests/validate_structure.py
      - name: Commit only generated assets to editorial branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Build context-first Moran pilot publication"
            git push origin HEAD:editorial/contextual-companions-source-depth-moran
          fi
