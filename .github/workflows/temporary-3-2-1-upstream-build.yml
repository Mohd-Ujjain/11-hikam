name: Temporary canonical build for 3.2.1 upstream review
on:
  push:
    branches: [editorial/3-2-1-amiri-fitra-source-rework-2026-11-28]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/3-2-1-amiri-fitra-source-rework-2026-11-28
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical rebuild, editorial checks and hash verification
        run: |
          python src/build.py
          python src/build.py --check
          python src/tests/verify_hikam_3_2_1_through_3_2_6.py
          python src/tests/verify_amiri_3_2_1_source_led_aids.py
      - name: Commit rebuilt publication artifacts to review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Build candidate 3.2.1 verified assets [skip ci]"
            git push origin HEAD:refs/heads/editorial/3-2-1-amiri-fitra-source-rework-2026-11-28
          fi
          python src/build.py --check
