name: Verify Arabic Plato 2.1.8 on second-account fork
on:
  push:
    branches: [editorial/2-1-8-arabic-source-faithful]
permissions:
  contents: write
concurrency:
  group: hikam-plato-218-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Require only the secondary repository and fixed review branch
        run: |
          test "$GITHUB_REPOSITORY" = "Mohd-Ujjain/11-hikam"
          test "$GITHUB_REF_NAME" = "editorial/2-1-8-arabic-source-faithful"
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical build and reproducibility
        run: |
          python src/build.py
          python src/build.py --check
      - name: Full source, structure, archive and offline checks
        run: |
          set -e
          python src/tests/verify_dossier_archive.py
          python src/tests/verify_publication.py
          python src/tests/verify_reading_companions.py
          python src/tests/verify_source_attribution.py
          python src/tests/verify_3_4_house_style.py
          python src/tests/verify_editorial_fidelity.py
          python src/tests/verify_papineau_source_fidelity.py
          python src/tests/verify_gutting_source_fidelity.py
          python src/tests/verify_critchley_source_fidelity.py
          python src/tests/verify_bird_source_fidelity.py
          python src/tests/verify_common_good_source_fidelity.py
          python src/tests/verify_war_source_fidelity.py
          python src/tests/verify_wolff_source_fidelity.py
          python src/tests/verify_liberty_source_fidelity.py
          python src/tests/verify_arabic_politics_source_fidelity.py
          python src/tests/verify_arabic_plato_source_fidelity.py
          python src/tests/validate_structure.py
          python src/tests/verify_sidebar.py
          python src/tests/verify_reading_progress.py
          python src/tests/verify_reader_search_tabs.py
          python src/tests/verify_revision_visibility.py
          python src/tests/verify_search_integrity.py
          python src/tests/verify_mobile_interaction.py
          python src/tests/verify_visual_polish.py
          node src/tests/test_offline_cache.mjs
          node src/tests/test_optional_precache.mjs
      - name: Install pinned browser and PDF tools
        run: |
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          python -m playwright install chromium
      - name: Run full Chromium, RTL, contrast, keyboard, print, A4 and PWA suite
        run: |
          set -e
          python src/tests/browser_quality.py
          python src/tests/browser_reading_companions.py
          python src/tests/browser_design_tokens.py
          python src/tests/browser_3_4_house_style.py
          python src/tests/browser_batch2_continuity.py
          python src/tests/browser_batch4_edition_migration.py
          python src/tests/browser_pwa_updates.py
      - name: Preserve generated edition and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hikam-plato-218-${{ github.run_id }}
          path: |
            index.html
            src/philosophy_study_notes.html
            service-worker.js
            test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit verified generated outputs to fork branch only
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Build tested Arabic Plato 2.1.8 reader outputs [skip ci]"
            git push origin HEAD:refs/heads/editorial/2-1-8-arabic-source-faithful
          fi
          python src/build.py --check
