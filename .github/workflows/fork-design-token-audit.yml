name: Fork QA — existing design tokens, contrast and full reader
on:
  push:
    branches: [fix/design-token-contrast-360-hue-audit]
permissions:
  contents: write
concurrency:
  group: design-token-contrast-360-audit
  cancel-in-progress: true
jobs:
  verify:
    name: Source, color contrast, full reader, A4 print and PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical publication build and edition check
        run: |
          python src/build.py
          python src/build.py --check
      - name: Source, structure and offline regressions
        run: |
          set -e
          python src/tests/verify_publication.py
          python src/tests/verify_reading_companions.py
          python src/tests/verify_source_attribution.py
          python src/tests/verify_3_4_house_style.py
          python src/tests/verify_editorial_fidelity.py
          python src/tests/validate_structure.py
          python src/tests/verify_sidebar.py
          python src/tests/verify_reading_progress.py
          python src/tests/verify_reader_search_tabs.py
          python src/tests/verify_revision_visibility.py
          python src/tests/verify_search_integrity.py
          python src/tests/verify_mobile_interaction.py
          python src/tests/verify_visual_polish.py
          node src/tests/test_offline_cache.mjs
          node src/tests/test_optional_precache.mjs
      - name: Install browser and PDF tools
        run: |
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          python -m playwright install chromium
      - name: Audit ALL 39 chapters' computed color/typography/contrast
        run: python src/tests/browser_design_tokens.py
      - name: Full Chromium, revision-page/PDF, RTL and offline PWA regressions
        run: |
          set -e
          python src/tests/browser_quality.py
          python src/tests/browser_reading_companions.py
          python src/tests/browser_3_4_house_style.py
          python src/tests/browser_batch2_continuity.py
          python src/tests/browser_batch4_edition_migration.py
          python src/tests/browser_pwa_updates.py
      - name: Upload PDF/screenshots if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hikam-design-token-contrast-${{ github.run_id }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit verified generated assets to the fork only
        run: |
          set -e
          test "$GITHUB_REPOSITORY" = "Mohd-Ujjain/11-hikam"
          test "$GITHUB_REF_NAME" = "fix/design-token-contrast-360-hue-audit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Build contrast-verified Hikam reader [skip ci]"
            git push origin HEAD:refs/heads/fix/design-token-contrast-360-hue-audit
          fi
          python src/build.py --check
