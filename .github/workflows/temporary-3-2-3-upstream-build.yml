name: Temporary canonical build for targeted-reviewed 3.2.3
on:
  push:
    branches: [editorial/3-2-3-amiri-fine-tuning-source-2026-11-28]
permissions:
  contents: write
jobs:
  generated_assets:
    name: Regenerate and pin 3.2.3 publication assets on review branch
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/3-2-3-amiri-fine-tuning-source-2026-11-28
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical build and fast 3.2.3 source/Companion/structure verification
        run: |
          python src/build.py
          python src/build.py --check
          python src/tests/verify_amiri_3_2_3_source_led_aids.py
          python src/tests/verify_reading_companions.py
          python src/tests/verify_publication.py
      - name: Commit only generated reader files to upstream review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Build targeted-verified 3.2.3 publication assets [skip ci]"
            git push origin HEAD:refs/heads/editorial/3-2-3-amiri-fine-tuning-source-2026-11-28
          fi
          python src/build.py --check
