          PATCH_BYTES
          git apply --index /tmp/editorial.patch
          cat >/tmp/hikam_33_scope.py <<'SCOPE_PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import html, json, re, subprocess
          R=Path.cwd()
          S=R/'src'
          base='6fa13f159c628ccc8d32b3b9e727576bf02ab6e4'
          ids=['ch3-3-7','ch3-3-8']
          def old(path):
              return subprocess.check_output(['git','show',f'{base}:{path}']).decode()
          def chapter(html,key):
              return re.search(rf'(?ms)^<section class="chapter(?: rtl)?" id="{key}"[^\n]*>.*?^</section>',html)[0]
          print('Checking exact scope against',base)
          for p in sorted((S/'chapters').glob('*.html')):
              rel=str(p.relative_to(R))
              if p.name=='subtopic-3-3.html':
                  before=old(rel); now=p.read_text()
                  for k in ('ch3-3-2','ch3-3-3','ch3-3-4','ch3-3-5','ch3-3-6'):
                      prior=chapter(before,k)
                      if k=='ch3-3-6':
                          prior=prior.replace('<a href="#ch3-4-3" class="endnav-btn endnav-next">Next Available Dossier · <bdi>3.4.3</bdi> →</a>','<a href="#ch3-3-7" class="endnav-btn endnav-next">Next Available Dossier · <bdi>3.3.7</bdi> →</a>')
                      assert chapter(now,k)==prior,k
                  continue
              assert p.read_text()==old(rel),rel
          for p in ('src/philosophy_notes.js','src/reading_companions.js','src/offline-reader.js','src/service-worker.template.js','.github/workflows/verify-pages.yml'):
              assert (R/p).read_text()==old(p),p
          p='src/philosophy_notes.css'
          css=(R/p).read_text()
          strip=r'(?m)^  @page ch3-3-[78]\{[^\n]*\}\n|(?ms:^  @page rev3-3-[78]\{.*?^  \}\n)|(?m:^  #ch3-3-[78] \.chapter-body,[^\n]*\n)'
          assert re.sub(strip,'',css)==old(p),'Expected only two new named body/revision page templates and chapter bindings'
          p='src/reading_companions.json'
          current=json.loads((R/p).read_text())['companions']
          previous=json.loads(old(p))['companions']
          assert [x for x in current if x['chapter'] not in ids]==previous
          assert len(current)>len(previous)
          main=(S/'main.html').read_text()
          index=(R/'index.html').read_text()
          expected=re.findall(r'<section class="chapter[^"]*" id="(ch\d+-\d+-\d+)"',old('index.html'))
          i=expected.index('ch3-4-3')
          expected[i:i]=ids
          assert re.findall(r'<section class="chapter[^"]*" id="(ch\d+-\d+-\d+)"',index)==expected
          AIDS=set('box checkpoint comparison tbl-wrap section-objective golden-quote hierarchy analogy concept-rel'.split())
          DEPTH=re.compile(r'<details class="hikam-source-depth-inline"[^>]*>[\s\S]*?</details>')
          class Words(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack=[]; self.count=[0,0]
              def handle_starttag(self,tag,attrs):
                  if tag not in {'br','hr','img','input'}:
                      self.stack.append((tag,bool(AIDS&set(dict(attrs).get('class','').split()))))
              def handle_endtag(self,tag):
                  for i in reversed(range(len(self.stack))):
                      if self.stack[i][0]==tag:
                          self.stack=self.stack[:i];break
              def handle_data(self,data):
                  self.count[any(v for _,v in self.stack)]+=len(data.split())
          for key,hue,prev,nxt in zip(ids,(8,28),('ch3-3-6','ch3-3-7'),('ch3-3-8','ch3-4-3')):
              sec=chapter(index,key)
              rtl=''
              lang=' lang="ar"' if rtl else ''
              assert sec.startswith(f'<section class="chapter{rtl}" id="{key}"{lang} style="--hue:{hue};">')
              author=[x['source']['author'] for x in current if x['chapter']==key][0]
              assert sec.count('class="endh"')==6 and sec.count('class="examq-cat"')==5
              credit=re.search(r'<div class="chapter-source"[^>]*>(.*?)</div>',sec,re.S)[1]
              assert author in html.unescape(re.sub(r'<[^>]*>','',credit)),(key,credit,author)
              assert author in [line for line in main.splitlines() if f'href="#{key}"' in line][0]
              nav=sec.split('<nav class="chapter-endnav"',1)[1].split('</nav>',1)[0]
              assert f'href="#{nxt}"' in nav and f'href="#{prev}"' in nav
              body=sec.split('<div class="chapter-body">',1)[1].split('<nav class="chapter-endnav"',1)[0]
              w=Words(); w.feed(DEPTH.sub('',body))
              a,b=w.count
              assert 650<=a<=850 and 850<=b<=1150 and 1500<=a+b<=2000,(key,w.count)
              entries=[c for c in current if c['chapter']==key]
              depths=list(DEPTH.finditer(body))
              assert len(entries)==len(depths)>0
              for c in entries:
