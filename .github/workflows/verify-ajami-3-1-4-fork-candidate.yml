# Testing-fork-only verification. Do not transfer this file to authoritative main.
name: Verify Ajami 3.1.4 source-led Arabic study aids on secondary fork
on:
  push:
    branches:
      - editorial/3-1-4-ajami-arabic-aids-2026-11-28
    paths-ignore:
      - 'index.html'
      - 'src/philosophy_study_notes.html'
      - 'service-worker.js'
      - '.github/ajami-3-1-4-fork-ci-status.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ajami-3-1-4-fork-candidate
  cancel-in-progress: true
jobs:
  verify-build-and-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Require correct secondary fork and isolated branch
        run: |
          test "$GITHUB_REPOSITORY" = "Mohd-Ujjain/11-hikam"
          test "$GITHUB_REF_NAME" = "editorial/3-1-4-ajami-arabic-aids-2026-11-28"
      - name: Checkout exact secondary-fork candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify canonical reader
        run: |
          set -euo pipefail
          python src/build.py
          python src/build.py --check
      - name: Run all current upstream static and chapter source regressions
        run: |
          set -euo pipefail
          python src/tests/verify_dossier_archive.py
          python src/tests/verify_publication.py
          python src/tests/verify_reading_companions.py
          python src/tests/verify_source_attribution.py
          python src/tests/verify_3_4_house_style.py
          python src/tests/verify_editorial_fidelity.py
          python src/tests/verify_papineau_source_fidelity.py
          python src/tests/verify_gutting_source_fidelity.py
          python src/tests/verify_critchley_source_fidelity.py
          python src/tests/verify_bird_source_fidelity.py
          python src/tests/verify_common_good_source_fidelity.py
          python src/tests/verify_war_source_fidelity.py
          python src/tests/verify_wolff_source_fidelity.py
          python src/tests/verify_liberty_source_fidelity.py
          python src/tests/verify_arabic_politics_source_fidelity.py
          python src/tests/verify_arabic_plato_source_fidelity.py
          python src/tests/verify_arabic_metaphysics_source_fidelity.py
          python src/tests/verify_arabic_metaphysics_division_source_fidelity.py
          python src/tests/verify_arabic_metaphysics_islam_christian_source_fidelity.py
          python src/tests/verify_metaphysics_structure_2_2_5.py
          python src/tests/verify_metaphysics_substance_2_2_6.py
          python src/tests/verify_philosophy_religion_3_1_1_kellenberger.py
          python src/tests/verify_philosophy_religion_3_1_2_yandell.py
          python src/tests/verify_kenny_3_1_3_source_fidelity.py
          python src/tests/verify_philosophy_religion_3_1_4_3_1_5_arabic.py
          python src/tests/verify_ajami_3_1_4_pedagogical_aids.py
          python src/tests/validate_structure.py
          python src/tests/verify_sidebar.py
          python src/tests/verify_reading_progress.py
          python src/tests/verify_reader_search_tabs.py
          python src/tests/verify_revision_visibility.py
          python src/tests/verify_search_integrity.py
          python src/tests/verify_mobile_interaction.py
          python src/tests/verify_visual_polish.py
          node src/tests/test_offline_cache.mjs
          node src/tests/test_optional_precache.mjs
      - name: Install pinned Chromium and PDF inspection tools
        run: |
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          python -m playwright install chromium
      - name: Run all current upstream browser, RTL, accessibility, print and offline regressions
        run: |
          set -euo pipefail
          python src/tests/browser_quality.py
          python src/tests/browser_reading_companions.py
          python src/tests/browser_design_tokens.py
          python src/tests/browser_kenny_3_1_3_aids.py
          python src/tests/browser_ajami_3_1_4_aids.py
          python src/tests/browser_3_4_house_style.py
          python src/tests/browser_batch2_continuity.py
          python src/tests/browser_batch4_edition_migration.py
          python src/tests/browser_pwa_updates.py
      - name: Keep browser screenshots, printed samples and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ajami-3-1-4-source-and-aids-${{ github.run_id }}
          path: |
            index.html
            src/philosophy_study_notes.html
            service-worker.js
            test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit only generated reader assets after every gate passes
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Build verified Ajami 3.1.4 reader outputs [skip ci]"
            git push origin "HEAD:refs/heads/editorial/3-1-4-ajami-arabic-aids-2026-11-28"
          fi
          python src/build.py --check
      - name: Record exact fork verification outcome
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > .github/ajami-3-1-4-fork-ci-status.md <<EOF
          # Ajami 3.1.4 testing-fork release gate
          Result: $CHECK_STATUS
          Workflow run: https://github.com/Mohd-Ujjain/11-hikam/actions/runs/$RUN_ID
          Branch: editorial/3-1-4-ajami-arabic-aids-2026-11-28
          Checked head: $(git rev-parse HEAD)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ajami-3-1-4-fork-ci-status.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Ajami fork verification status [skip ci]"
            git push origin "HEAD:refs/heads/editorial/3-1-4-ajami-arabic-aids-2026-11-28"
          fi
