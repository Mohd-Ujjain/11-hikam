name: Fork QA — contextual companions and inline source depth
on:
  push:
    branches: [editorial/context-depth-paragraph-accessibility-111-112]
permissions:
  contents: write
concurrency:
  group: contextual-source-depth-pilot
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build canonical book and check generated edition
        run: |
          python src/build.py
          python src/build.py --check
      - name: Source, structure, search, progress and offline unit validation
        run: |
          set -e
          python src/tests/verify_publication.py
          python src/tests/verify_reading_companions.py
          python src/tests/verify_source_attribution.py
          python src/tests/verify_3_4_house_style.py
          python src/tests/verify_editorial_fidelity.py
          python src/tests/validate_structure.py
          python src/tests/verify_sidebar.py
          python src/tests/verify_reading_progress.py
          python src/tests/verify_reader_search_tabs.py
          python src/tests/verify_revision_visibility.py
          python src/tests/verify_search_integrity.py
          python src/tests/verify_mobile_interaction.py
          python src/tests/verify_visual_polish.py
          node src/tests/test_offline_cache.mjs
          node src/tests/test_optional_precache.mjs
      - name: Install pinned Chromium and PDF libraries
        run: |
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          python -m playwright install chromium
      - name: Full browser, print, RTL, accessible popup and PWA suite
        run: |
          set -e
          python src/tests/browser_quality.py
          python src/tests/browser_reading_companions.py
          python src/tests/browser_3_4_house_style.py
          python src/tests/browser_batch2_continuity.py
          python src/tests/browser_batch4_edition_migration.py
          python src/tests/browser_pwa_updates.py
      - name: Commit only verified generated assets to fork editorial branch
        run: |
          set -e
          test "$GITHUB_REPOSITORY" = "Mohd-Ujjain/11-hikam"
          test "$GITHUB_REF_NAME" = "editorial/context-depth-paragraph-accessibility-111-112"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Build verified paragraph-level Source Depth edition [skip ci]"
            git push origin HEAD:editorial/context-depth-paragraph-accessibility-111-112
          fi
          python src/build.py --check
