name: Fork QA — Papineau source-faithful Dossier 1.1.3
on:
  push:
    branches: [editorial/113-papineau-source-faithful]
permissions:
  contents: write
concurrency:
  group: fork-papineau-113
  cancel-in-progress: true
jobs:
  audit:
    name: Build, source, browser, print and PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild the canonical single-file reader
        run: |
          python src/build.py
          python src/build.py --check
      - name: Run complete source and reader contract suite
        run: |
          set -e
          python src/tests/verify_publication.py
          python src/tests/verify_reading_companions.py
          python src/tests/verify_papineau_source_fidelity.py
          python src/tests/verify_source_attribution.py
          python src/tests/verify_3_4_house_style.py
          python src/tests/verify_editorial_fidelity.py
          python src/tests/validate_structure.py
          python src/tests/verify_sidebar.py
          python src/tests/verify_reading_progress.py
          python src/tests/verify_reader_search_tabs.py
          python src/tests/verify_revision_visibility.py
          python src/tests/verify_search_integrity.py
          python src/tests/verify_mobile_interaction.py
          python src/tests/verify_visual_polish.py
          node src/tests/test_offline_cache.mjs
          node src/tests/test_optional_precache.mjs
      - name: Install Chromium and PDF verification tools
        run: |
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          python -m playwright install chromium
      - name: Verify every chapter's brand tokens and text contrast
        run: python src/tests/browser_design_tokens.py
      - name: Verify all contextual cues, reading and accessible popovers
        run: python src/tests/browser_reading_companions.py
      - name: Inspect full reader and real A4 print
        run: python src/tests/browser_quality.py
      - name: Inspect rebuilt 3.4 editorial modules and print
        run: python src/tests/browser_3_4_house_style.py
      - name: Verify saved place, permalink and chapter transitions
        run: |
          python src/tests/browser_batch2_continuity.py
          python src/tests/browser_batch4_edition_migration.py
      - name: Verify offline PWA install and edition updates
        run: python src/tests/browser_pwa_updates.py
      - name: Upload actual print PDFs and screenshots if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papineau-113-browser-audit-${{ github.run_id }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit only verified generated assets to this fork branch
        run: |
          set -e
          test "$GITHUB_REPOSITORY" = "Mohd-Ujjain/11-hikam"
          test "$GITHUB_REF_NAME" = "editorial/113-papineau-source-faithful"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Build verified Papineau 1.1.3 reader [skip ci]"
            git push origin HEAD:refs/heads/editorial/113-papineau-source-faithful
          fi
          python src/build.py --check
